services:
  db:
    image: mariadb:10.11
    container_name: dbBtbp
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - pgdata:/var/lib/mysql/
    networks:
      - back
  back:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: back
    environment:
      MYSQL_HOST: db
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER}
      SECRET: ${SECRET}
    ports:
      - "127.0.0.1:${PORTBACK}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - back
  front:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: front
    depends_on:
      back:
        condition: service_started
    ports:
      - "127.0.0.1:${PORTFRONT}"
    networks:
      - front
volumes:
  pgdata:
networks:
  back:
  front:
