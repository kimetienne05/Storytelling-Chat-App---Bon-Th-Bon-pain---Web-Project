image: denoland/deno:latest

# CORRECTION ICI : Lint doit être le tout premier stage
stages:
  - lint
  - build
  - test

# 1. Vérification rapide (échoue vite si le code est sale)
lint:
  stage: lint
  script:
    - echo "Vérification du code..."
    - deno lint
    - deno fmt --check

# 2. Compilation / Préparation
build:
  stage: build
  script:
    - echo "Compilation du code..."
    # Exemple concret pour Deno : mettre en cache les dépendances
    - deno cache src/main.ts 
    - echo "Terminé !"
    - echo "Build du commit $CI_COMMIT_SHORT_SHA sur la branche $CI_COMMIT_BRANCH"

# 3. Tests lourds avec Base de Données
test:
  stage: test
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - echo "Démarrage des services..."
    - docker compose up -d
    - sleep 15
    - echo "Lancement des tests..."
    - deno test --allow-all
    - echo "Nettoyage..."
    - docker compose down -v
    - echo "Tous les tests passent !"