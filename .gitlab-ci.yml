image: denoland/deno:latest

# CORRECTION ICI : Lint doit être le tout premier stage
stages:
  - lint
  - test
  - build

# 1. Vérification rapide (échoue vite si le code est sale)
lint:
  stage: lint
  script:
    - echo "Vérification du code..."
    - deno lint
    - deno fmt --check

# 2. Compilation / Préparation
test:
  stage: test
  script:
    # Exemple concret pour Deno : mettre en cache les dépendances
    - echo "Lancement des tests..."
    - deno test --allow-env ./tests/
    - echo "Terminé !"

# 3. Tests lourds avec Base de Données
build:
  stage: build
  tags:
    - docker-privileged
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
    - echo "Build du commit $CI_COMMIT_SHORT_SHA sur la branche $CI_COMMIT_BRANCH"
    - docker compose up -d --build
    - sleep 15
    - echo "Nettoyage..."
    - docker compose push
    - docker compose down -v
