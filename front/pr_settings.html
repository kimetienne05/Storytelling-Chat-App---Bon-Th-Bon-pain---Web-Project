<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title> pr_settings </title>
        <style>
            .pr{
                /* permet de ne pas afficher toute les morceaux du jeu d'un coup */
                display: none; 
            }
            /* on affiche au début que les settings */
            #game_settings{
                display: block;
            }

        </style>
        <link rel="stylesheet" href="style.css">

    </head>
    <body >

        <!-- Menu settings -->
        <div id= "game_settings" class="pr">
            <p>nombre de potins dans la game</p>
            <input type="number" id="nb_potin">  
            <p>temps accordé pour preparer le thé</p>
            <input type="number" id="prep_time"> 
            <p>temps d'un tour de guess (si tout le monde a guess direct to resultat)</p>
            <input type="number" id="round_time">     
            <!-- quand la partie est publié, le bouton dans le chat doit de nouveua être accessible -->
            <button onclick="go_to_game(); settings_done();">publier la partie</button>
        </div>
        <script src = "pr_settings.js" defer></script>
    </body>
</html>
