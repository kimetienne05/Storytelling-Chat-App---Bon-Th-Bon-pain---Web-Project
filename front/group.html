<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <title>Groupe</title>
    <script src="group.js" defer></script>
    <link rel="stylesheet" href="group.css">
  </head>
  <body>
    <div class="title">
      <button onclick="Accueil();">Accueil</button>
      <h1 id="groupTitle"></h1>
    </div>
    <div class="main">
      <div class="left">
        <div class="gestionThe">
          <h2>Gestion des thés</h2>
          <button>Ajouter un Thé</button>
          <button>Supprimer un Thé</button>
        </div>

        <div class="groupe">
          <h2>Gestion du groupe</h2>
          <div>
            <button onclick="CreePopup()">+ Inviter</button>
            <button onclick="QuitGroup()">Quitter</button>
          </div>
          <div class="members">
            <h3>Membres du groupe</h3>
            <div id="memberList"></div>
          </div>
        </div>
      </div>
      <div class="the">
        <h2>Thé</h2>
      </div>
      <div class="right">
        <div class="boulangerie">
          <h2>Boulangerie</h2>
        </div>
        <div class="chat">
          <h2>Chat</h2>

          <div id="chatMessages"></div>

          <div class="chatInputBox">
            <input
              type="text"
              id="chatInput"
              placeholder="Votre message..."
            >

            <button onclick="SendMessage()">
              Envoyer
            </button>
          </div>
        </div>
      </div>
    </div>
    <div id="popup" style="display: none">
      <div id="popupouvert">
        <h2>Inviter un utilisateur</h2>

        <input
          id="searchUser"
          type="text"
          placeholder="Rechercher un utilisateur"
          onkeyup="FilterUsers()"
        >

        <div id="userList"></div>

        <br>

        <button onclick="InviteUsers()">Inviter</button>
        <button onclick="FermerPopup()">Fermer</button>
      </div>
    </div>
  </body>
</html>
